services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zuno
      POSTGRES_PASSWORD: zuno
      POSTGRES_DB: zuno
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuno -d zuno"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://zuno:zuno@db:5432/zuno?schema=public
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
